name: kyron

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kyron
      POSTGRES_USER: kyron
      POSTGRES_PASSWORD: kyron_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyron -d kyron"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://kyron:kyron_dev@postgres:5432/kyron
      SIMULATOR_URL: http://simulator:8090
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SIMULATOR_TOKEN: ${SIMULATOR_TOKEN:?Set SIMULATOR_TOKEN in .env}
      CLIENT_URL: http://localhost:5173
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  simulator:
    init: true
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      DATABASE_URL: postgresql://kyron:kyron_dev@postgres:5432/kyron
      SERVER_URL: http://server:8000/api
      SERVER_TOKEN: ${SIMULATOR_TOKEN:?Set SIMULATOR_TOKEN in .env}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/status')"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 120s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_PROXY_TARGET: http://server:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
